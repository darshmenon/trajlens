name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: python -m pip install ".[test]"
      - name: The C++ core was built
        run: python -c "from trajlens import metrics; assert metrics.have_cpp(), 'C++ core was not built'"
      - name: Test (C++ core)
        run: python -m pytest -q
      - name: Test (numpy fallback)
        run: TRAJLENS_NO_CPP=1 python -m pytest -q
